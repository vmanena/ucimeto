<article class="webinar-card">
  <div class="webinar-date">{{DATE}}</div>

  <h2 class="webinar-title">{{TITLE}}</h2>

  <div class="webinar-prices">
    {{VARIANT_1}}
    {{VARIANT_2}}
    {{VARIANT_3}}
  </div>

  <a
    class="webinar-button"
    href="{{URL}}"
    target="_blank"
    rel="noopener noreferrer"
  >
    Více informací a objednávka
  </a>
</article>
